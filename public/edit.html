<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

* { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); } form { width: 100%; max-width: 400px; padding: 35px; background-color: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); } input[type="text"] { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; } input[type="text"]:focus { border-color: #667eea; } button { width: 100%; padding: 14px; border: none; border-radius: 8px; background-color: #667eea; color: white; font-size: 16px; font-weight: bold; cursor: pointer; } button:hover { background-color: #5568d8; } @media (max-width: 500px) { body { padding: 15px; } form { padding: 25px 20px; } input[type="text"] { padding: 12px; font-size: 15px; } button { padding: 12px; } }

    </style>
</head>
<body>
    
    <form action="/update" method="post">
        <input type="hidden" name="id" id="id">
        <input type="text" name="username" id="name">
        <input type="text" name="age" id="age">
        <button type="submit">update</button>    
    
    </form>

    <script>
        const url = new URLSearchParams(window.location.search)
        const id  = url.get("id")
        // console.log(id)
        async function getdata(){
            const datas = await fetch(`/read/${id}`)
            const jsondata = await datas.json()
            // console.log(jsondata)
            document.getElementById("name").value = jsondata.name
             document.getElementById("age").value = jsondata.age
             document.getElementById("id").value = id

        }
        getdata()
    </script>

</body>
</html>
